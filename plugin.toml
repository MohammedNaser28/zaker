id = "mohammed-niri/dhikr"
name = "Dhikr"
version = "0.1.0"
plugin_api = 22
author = "mohammed-niri"
license = "MIT"
icon = "moon"
description = "Periodic salawat upon the Prophet and azkar reminders via shell notifications."
tags = ["islamic", "reminder", "dhikr"]

[[setting]]
key = "interval"
type = "int"
label_key = "settings.interval.label"
description_key = "settings.interval.description"
default = 30
min = 1
max = 180

[[setting]]
key = "salawat_enabled"
type = "bool"
label_key = "settings.salawat_enabled.label"
description_key = "settings.salawat_enabled.description"
default = true

[[setting]]
key = "azkar_enabled"
type = "bool"
label_key = "settings.azkar_enabled.label"
description_key = "settings.azkar_enabled.description"
default = true

[[setting]]
key = "notify_on_start"
type = "bool"
label_key = "settings.notify_on_start.label"
description_key = "settings.notify_on_start.description"
default = true

[[service]]
id = "remind"
entry = "service.luau"

[[widget]]
id = "dhikr"
entry = "widget.luau"

[[shortcut]]
id = "toggle"
entry = "shortcut.luau"

[[launcher_provider]]
id = "find"
entry = "provider.luau"
prefix = "dhikr"
glyph = "moon"
